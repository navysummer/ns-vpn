[package]
name = "ns-vpn"
version = "1.0.0"
description = "NS VPN - A modern proxy GUI client based on Tauri + Vue"
authors = ["you"]
license = "GPL-3.0-only"
default-run = "ns-vpn"
build = "build.rs"
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [
  "devtools",
  "tray-icon",
  "image-ico",
  "image-png",
] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.9"
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
log = "0.4"
opener = "0.7"
reqwest = { version = "0.12", features = ["json"] }
dirs = "6"
