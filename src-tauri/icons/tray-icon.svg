  <line x1="26" y1="22" x2="28" y2="18" stroke="#00d4ff" stroke-width="1.2" opacity="0.7"/>
  <line x1="22" y1="26" x2="19" y2="28" stroke="#00d4ff" stroke-width="1.2" opacity="0.7"/>
  <line x1="26" y1="26" x2="29" y2="28" stroke="#00d4ff" stroke-width="1.2" opacity="0.7"/>
